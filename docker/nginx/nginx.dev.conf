worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 10240;
}

http {
    server_names_hash_bucket_size 128;
    server_names_hash_max_size 1024;
    client_max_body_size 50M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 80;
        server_name tcpanel.myqr-parking.uz back.myqr-parking.uz tback.myqr-parking.uz tmerchant.myqr-parking.uz;

        # Server files from acme-challenge
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html/challenge;
        }

        # Redirect HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------- tback.myqr-parking.uz HTTPS -----------------------------------
    server {
        include       mime.types;
        sendfile on;
        default_type  application/octet-stream;

        listen 443 ssl;
        server_name tback.myqr-parking.uz back.myqr-parking.uz;

        ssl_certificate /etc/letsencrypt/live/tback.myqr-parking.uz-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tback.myqr-parking.uz-0001/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            root /usr/share/nginx/html/tback;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /files {
            root /usr/share/nginx/html;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept' always;

            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            try_files $uri $uri/ =404;
        }

        location /api/v1 {
            proxy_pass http://qr-parking:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger/ {
            proxy_pass http://qr-parking:8080/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ----------------------------------- tcpanel.myqr-parking.uz HTTPS -----------------------------------
    server {
        include       mime.types;
        sendfile on;
        default_type  application/octet-stream;

        listen 443 ssl;
        server_name tcpanel.myqr-parking.uz;

        ssl_certificate /etc/letsencrypt/live/tcpanel.myqr-parking.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tcpanel.myqr-parking.uz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            root /usr/share/nginx/html/tcpanel;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
    # ----------------------------------- tmerchant.myqr-parking.uz HTTPS -----------------------------------
