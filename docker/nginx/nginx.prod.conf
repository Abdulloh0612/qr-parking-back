worker_processes auto;
worker_rlimit_nofile 100000;  # Move this to the top level

events {
    worker_connections 10240;
}

http {
    client_max_body_size 50M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 80;
        server_name tback.myqr-parking.uz;

        # Server files from acme-challenge
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html/challenge;
        }

        # Redirect HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------- tback.myqr-parking.uz -----------------------------------
    server {
        include       mime.types;
        sendfile on;
        default_type  application/octet-stream;

        listen 443 ssl;
        server_name tback.myqr-parking.uz;

        ssl_certificate /etc/letsencrypt/live/tback.myqr-parking.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tback.myqr-parking.uz/privkey.pem;

        # Additional SSL configurations (optional)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

        # Serve deeplink files
        location ^~ /.well-known/ {
            default_type application/json;
            root /usr/share/nginx/html/files;
        }

        # Serve static files
        location /files {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files /$uri /html/$uri/ =404;
        }

        # Proxy to main service
        location /api/v1 {
            proxy_pass http://qr-parking:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Proxy Swagger documentation (all panels)
        # Must use /swagger/ with trailing slash to properly proxy
        location /swagger/ {
            proxy_pass http://qr-parking:8080/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
       
    }

}