worker_processes auto;
worker_rlimit_nofile 100000;  # Move this to the top level

events {
    worker_connections 10240;
}

http {
    client_max_body_size 50M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        include       mime.types;
        sendfile on;
        default_type  application/octet-stream;

        listen 443;

        # Serve deeplink files
        location ^~ /.well-known/ {
            default_type application/json;
            root /usr/share/nginx/html/files;
        }

        # Server static files
        location /files {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files /$uri /html/$uri/ =404;
        }

        # Proxy Swagger documentation (all panels)
        # Must use /swagger/ with trailing slash to properly proxy
        location /swagger/ {
            proxy_pass http://qr-parking:8090/swagger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers for Swagger UI
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Proxy to main service
        location /api/v1 {
            proxy_pass http://qr-parking:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}
