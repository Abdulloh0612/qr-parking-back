services:
  app:
    build:
      dockerfile: ./docker/app/Dockerfile
      target: local
    container_name: qr-parking
    restart: always
    volumes:
      - ./:/usr/src/app
    networks:
      - qr-parking-network
    depends_on:
      - database
      - cache

  database:
    image: postgres:16-alpine
    container_name: qr-parking-database
    restart: always
    ports:
      - 5432:5432 # Do not expose this port in prod env
    volumes:
      - postgres-data-main:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf/:/etc/postgresql.conf
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
    env_file:
      - docker/postgres/.db.env
    networks:
      - qr-parking-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qr-parking-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
      - ./docker/pgadmin/pgpass:/pgpass 
    ports:
      - "5050:80"
    depends_on:
      - database
    networks:
      - qr-parking-network

  cache:
    image: redis
    container_name:  qr-parking-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - docker/redis/.redis.env
    networks:
      - qr-parking-network

  nginx:
    image: nginx:latest
    container_name: qr-parking-nginx
    restart: always
    ports:
      - 80:443
    volumes:
      - ./uploads:/usr/share/nginx/html/files:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - qr-parking-network
    depends_on:
      - app

volumes:
  postgres-data-main:
networks:
  qr-parking-network:
    external: true
